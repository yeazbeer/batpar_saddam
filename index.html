<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Batpar Saddam</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121521">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#121521;
    --surface:#1b1f29;
    --surface-alt:#232a36;
    --surface-raised:#2a3240;
    --line:#33415a;
    --text:#ede8dc;
    --muted:#899;
    --muted:#8a929f;
    --gold:#d9a441;
    --gold-dim:#8a6f3a;
    --red:#c0483b;
    --red-dim:#7a342c;
    --green:#5c8a6a;
    --blue:#4c7ea8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
  }
  #app{
    max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;position:relative;
    padding: max(24px, env(safe-area-inset-top,0px)) 24px max(24px, env(safe-area-inset-bottom,0px));
  }
  #scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #scroll::-webkit-scrollbar{display:none;}
  #content{display:flex;flex-direction:column;gap:12px;min-height:100%;transform-origin:center;}
  .label{font-size:15px;line-height:1.4;margin:0;color:var(--text);}
  .label.muted{color:var(--muted);}
  .label.gold{color:var(--gold);}
  .label.center{text-align:center;}
  .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--gold);font-weight:700;text-transform:uppercase;margin:0;}
  .title{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em;}
  .title.big{font-size:32px;}
  button{
    font-family:inherit;font-size:15px;font-weight:600;color:var(--text);
    background:var(--surface-alt);border:1px solid var(--line);border-radius:9px;
    padding:14px 16px;min-height:56px;cursor:pointer;transition:border-color .15s;
  }
  button:active{border-color:var(--gold-dim);}
  button.primary{
    background:var(--gold);color:#1a1508;border:none;font-weight:700;
  }
  button.small{min-height:46px;padding:0;width:46px;flex:0 0 auto;}
  button.ghost{background:transparent;}
  button:disabled{opacity:.4;}
  .row{display:flex;gap:8px;align-items:center;}
  .row.split > button{flex:1;}
  .flow{display:flex;flex-wrap:wrap;gap:8px 14px;}
  input[type=text],textarea{
    font-family:inherit;font-size:15px;background:var(--surface-alt);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:12px;width:100%;
  }
  textarea{min-height:84px;resize:vertical;}
  input::placeholder,textarea::placeholder{color:var(--muted);}
  .check{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;user-select:none;}
  .check input{width:18px;height:18px;accent-color:var(--gold);}
  .spacer{flex:0 0 auto;}
  .flex-spacer{flex:1 1 auto;}
  .pill-wrap{display:flex;justify-content:center;}
  .pill{
    background:var(--surface-alt);border:2px solid var(--gold);border-radius:24px;
    padding:12px 26px;font-size:24px;font-weight:800;color:var(--gold);
  }
  .card-wrap{display:flex;justify-content:center;}
  .card{
    background:var(--surface-alt);border:2px solid var(--line);border-radius:16px;
    padding:36px 24px;width:100%;max-width:280px;min-height:330px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center;transition:border-color .2s;
  }
  .card.imp{border-color:var(--red);border-width:3px;}
  .card.innocent{border-color:var(--green);border-width:3px;}
  .card.sheriff{border-color:var(--blue);border-width:3px;}
  .tap-btn{width:100%;min-height:200px;font-size:16px;white-space:pre-line;}
  .stamp{font-size:15px;font-weight:800;letter-spacing:.03em;}
  .stamp.imp{color:var(--red);}
  .stamp.sheriff{color:var(--blue);}
  .stamp.innocent{color:var(--gold);}
  .word{font-size:30px;font-weight:800;}
  .sub{font-size:12px;color:var(--muted);}
  .flip-x{transition:transform .15s ease-in;}
  .roster-row{font-size:13px;padding:2px 0;}
  .roster-row.out{opacity:.4;}
  .vote-btn{width:100%;text-align:left;}
  .vote-btn.picked{background:rgba(217,164,65,.18);border-color:var(--gold);color:var(--gold);}
  .name-row{display:flex;gap:8px;align-items:center;}
  .name-row input{flex:1;min-height:46px;}
  .timer-big{font-size:34px;font-weight:800;text-align:center;margin:0;}
  .result-block{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .result-name{font-size:32px;font-weight:800;line-height:1.15;}
  .badge{display:inline-block;padding:7px 20px;border-radius:20px;font-weight:800;font-size:13px;letter-spacing:.04em;}
  .badge.red{background:rgba(192,72,59,.16);color:var(--red);border:1px solid var(--red);}
  .badge.green{background:rgba(92,138,106,.16);color:var(--green);border:1px solid var(--green);}
  .badge.gold{background:rgba(217,164,65,.16);color:var(--gold);border:1px solid var(--gold);}
  .vote-breakdown{display:flex;flex-direction:column;gap:0;}
  .vote-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .vote-row:last-child{border-bottom:none;}
  .vote-name{width:34%;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vote-bar-track{flex:1;height:8px;background:var(--surface-alt);border-radius:4px;overflow:hidden;}
  .vote-bar-fill{height:100%;background:var(--gold);border-radius:4px;}
  .vote-count{font-weight:800;color:var(--gold);font-size:14px;min-width:52px;text-align:right;}
  #quitBtn{
    position:absolute;top:max(18px, env(safe-area-inset-top,0px));right:18px;
    width:36px;height:36px;min-height:0;border-radius:50%;padding:0;
    background:var(--surface-alt);border:1px solid var(--line);color:var(--muted);
    font-size:18px;line-height:1;display:none;align-items:center;justify-content:center;z-index:20;
  }
  #quitBtn.show{display:flex;}
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:24px;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:22px;max-width:340px;width:100%;text-align:center;
  }
  .modal h3{margin:0 0 8px;font-size:18px;}
  .modal p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.5;}
  .modal .row{gap:10px;}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ }
  }
</style>
</head>
<body>
<div id="app">
  <button id="quitBtn" aria-label="Quit match">✕</button>
  <div id="scroll"><div id="content"></div></div>
</div>

<div class="modal-backdrop" id="quitModal">
  <div class="modal">
    <h3>Quit this match?</h3>
    <p>You'll go back to setup. Progress in this round will be lost.</p>
    <div class="row">
      <button id="quitCancel">Stay</button>
      <button id="quitConfirm" class="primary">Quit to setup</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="exitModal">
  <div class="modal">
    <h3>Leaving already?</h3>
    <p>There's still more Batpar out there. Are you sure you want to quit?</p>
    <div class="row">
      <button id="exitCancel">Stay</button>
      <button id="exitConfirm" class="primary">Quit</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

// ============================================================
// BATPAR SADDAM — Impostor party word game (web rebuild)
// ============================================================

var BUILT_IN_CATEGORIES = {
  "Food": ["Pizza","Sushi","Mango","Burger","Biryani","Ice Cream","Pasta","Samosa","Tacos","Pancakes","Noodles","Chocolate","Curry","Popcorn","Dumplings"],
  "Animals": ["Elephant","Dolphin","Penguin","Tiger","Kangaroo","Octopus","Owl","Giraffe","Crocodile","Panda","Fox","Peacock","Camel","Hedgehog","Falcon"],
  "Movies & TV": ["Titanic","Avengers","Friends","Breaking Bad","Inception","Jaws","Frozen","The Office","Shrek","Interstellar","Squid Game","Batman","Stranger Things","Moana","Joker"],
  "Sports": ["Football","Cricket","Badminton","Swimming","Boxing","Tennis","Basketball","Chess","Archery","Volleyball","Kabaddi","Table Tennis","Golf","Skateboarding","Wrestling"],
  "Places": ["Beach","Airport","Hospital","Mosque","Museum","Stadium","Library","Market","Desert","Volcano","Rooftop","Classroom","Subway","Farm","Lighthouse"],
  "Everyday Objects": ["Umbrella","Toothbrush","Backpack","Mirror","Candle","Wallet","Ladder","Scissors","Pillow","Charger","Keychain","Flashlight","Blender","Helmet","Clock"],
  "Jobs": ["Doctor","Pilot","Chef","Firefighter","Teacher","Barber","Farmer","Photographer","Plumber","Tailor","Lawyer","Astronaut","Mechanic","Fisherman","Architect"],
  "Video Games": ["Minecraft","Fortnite","Chess.com","FIFA","Valorant","Among Us","Tetris","GTA","Pokemon","Free Fire","PUBG","Candy Crush","Roblox","Call of Duty","Clash Royale"]
};

// ---------------- State ----------------
var players = [];
var nextId = 0;
var selectedCategories = {};
var customCategories = {};

var imposterCount = 1;
var knowEachOther = false;
var survivorLimitEnabled = false;
var survivorLimit = 5;
var sheriffEnabled = false;
var sheriffId = -1;
var sheriffUsed = false;
var sheriffCaughtImposter = false;
var timerEnabled = false;
var timerMinutes = 3;

var roundNo = 1;
var word = "";
var category = "";
var imposterIds = [];
var revealOrder = [];
var revealIndex = 0;
var votingOrder = [];
var voteIndex = 0;
var votes = {};
var pendingVoteId = -1;
var scores = {};
var gamesPlayed = 0;
var caseNo = 0;

var timerRemaining = 0;
var timerLabelEl = null;
var countdownInterval = null;

var customFormVisible = false;

var inMatch = false; // controls quit button visibility

// ---------------- DOM refs ----------------
var contentEl = document.getElementById("content");
var scrollEl = document.getElementById("scroll");
var quitBtn = document.getElementById("quitBtn");
var quitModal = document.getElementById("quitModal");
var exitModal = document.getElementById("exitModal");

// ---------------- Audio (tiny synthesized clicks, no files needed) ----------------
var audioCtx = null;
function ctx(){
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  return audioCtx;
}
function beep(freq, dur, gainVal){
  var c = ctx();
  if (!c) return;
  if (c.state === "suspended") c.resume();
  var osc = c.createOscillator();
  var gain = c.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainVal, c.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  osc.connect(gain);
  gain.connect(c.destination);
  osc.start();
  osc.stop(c.currentTime + dur);
}
function playClick(){ beep(720, 0.06, 0.05); }
function playFlip(){ beep(420, 0.12, 0.04); setTimeout(function(){ beep(560, 0.09, 0.03); }, 60); }

// ---------------- Persistence ----------------
function loadCustomCategories(){
  try {
    var raw = localStorage.getItem("batpar_custom_categories");
    if (raw) customCategories = JSON.parse(raw) || {};
  } catch(e){ customCategories = {}; }
}
function saveCustomCategories(){
  try { localStorage.setItem("batpar_custom_categories", JSON.stringify(customCategories)); } catch(e){}
}

// ---------------- Helpers ----------------
function newId(){ nextId += 1; return nextId; }
function findPlayer(pid){
  for (var i=0;i<players.length;i++) if (players[i].id === pid) return players[i];
  return null;
}
function isAlive(pid){ var p = findPlayer(pid); return p ? p.alive : false; }
function allCategories(){
  var merged = {};
  for (var k in BUILT_IN_CATEGORIES) merged[k] = BUILT_IN_CATEGORIES[k];
  for (var k2 in customCategories) merged[k2] = customCategories[k2];
  return merged;
}
function formatTime(totalSec){
  var m = Math.floor(totalSec/60), s = totalSec%60;
  return m + ":" + (s<10?"0":"")+s;
}
function clampi(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function shuffle(arr){
  for (var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function clearContent(){ contentEl.innerHTML = ""; }
function addSpacer(h){
  var s = el("div"); s.style.height = (h===undefined?10:h)+"px"; s.className="spacer";
  contentEl.appendChild(s); return s;
}
function addFlexSpacer(){
  var s = el("div"); s.className="flex-spacer";
  contentEl.appendChild(s); return s;
}
function addLabel(text, size, colorClass, opts){
  opts = opts || {};
  var l = el("p", "label" + (colorClass?(" "+colorClass):""), text);
  l.style.fontSize = (size||15)+"px";
  if (opts.center) l.classList.add("center");
  if (opts.bold) l.style.fontWeight = "800";
  contentEl.appendChild(l);
  return l;
}
function addButton(text, callback, primary){
  var b = el("button", primary?"primary":"");
  b.textContent = text;
  b.addEventListener("click", function(){ playClick(); if (callback) callback(); });
  contentEl.appendChild(b);
  return b;
}
function makeCheckbox(text, checked, onToggle){
  var label = el("label", "check");
  var input = el("input"); input.type = "checkbox"; input.checked = checked;
  input.addEventListener("change", function(){ playClick(); onToggle(input.checked); });
  var span = el("span"); span.textContent = text;
  label.appendChild(input); label.appendChild(span);
  return label;
}
function addNamePill(name){
  var wrap = el("div","pill-wrap");
  var pill = el("div","pill",name);
  wrap.appendChild(pill);
  contentEl.appendChild(wrap);
}

// ---------------- Transitions ----------------
function renderWithFlip(renderFn){
  playFlip();
  contentEl.style.transition = "transform .14s ease-in";
  contentEl.style.transform = "scaleX(0.02)";
  setTimeout(function(){
    renderFn();
    scrollEl.scrollTop = 0;
    contentEl.style.transition = "none";
    contentEl.style.transform = "scaleX(0.02)";
    // force reflow then animate back
    void contentEl.offsetWidth;
    contentEl.style.transition = "transform .16s ease-out";
    contentEl.style.transform = "scaleX(1)";
  }, 140);
}
function renderWithSlide(renderFn){
  renderFn();
  scrollEl.scrollTop = 0;
  contentEl.style.transition = "none";
  contentEl.style.transform = "translateY(-60px)";
  contentEl.style.opacity = "0";
  void contentEl.offsetWidth;
  contentEl.style.transition = "transform .38s cubic-bezier(.2,.8,.2,1), opacity .3s ease-out";
  contentEl.style.transform = "translateY(0)";
  contentEl.style.opacity = "1";
}

// ---------------- Quit-to-setup / exit-app modals ----------------
function setInMatch(v){
  inMatch = v;
  quitBtn.classList.toggle("show", v);
}
quitBtn.addEventListener("click", function(){ playClick(); quitModal.classList.add("show"); });
document.getElementById("quitCancel").addEventListener("click", function(){ playClick(); quitModal.classList.remove("show"); });
document.getElementById("quitConfirm").addEventListener("click", function(){
  playClick();
  quitModal.classList.remove("show");
  countdownInterval && clearInterval(countdownInterval);
  setInMatch(false);
  renderWithFlip(renderSetup);
});
document.getElementById("exitCancel").addEventListener("click", function(){ playClick(); exitModal.classList.remove("show"); });
document.getElementById("exitConfirm").addEventListener("click", function(){ playClick(); exitModal.classList.remove("show"); window.close(); });

// Android hardware back button (works once wrapped in a WebView shell / TWA)
history.pushState({batpar:true}, "");
window.addEventListener("popstate", function(){
  history.pushState({batpar:true}, "");
  if (quitModal.classList.contains("show") || exitModal.classList.contains("show")) return;
  if (inMatch) quitModal.classList.add("show");
  else exitModal.classList.add("show");
});

// ============================================================
// SPLASH SCREEN
// ============================================================
function showSplash(){
  clearContent();
  addSpacer(90);
  var title = addLabel("BATPAR SADDAM", 32, "gold", {center:true, bold:true});
  title.classList.add("title","big");
  addSpacer(8);
  var sub = addLabel("Find the Batpar before they find you.", 13, "muted", {center:true});
  title.style.opacity = "0"; sub.style.opacity = "0";
  title.style.transition = "opacity .45s"; sub.style.transition = "opacity .45s";
  setTimeout(function(){ title.style.opacity = "1"; }, 30);
  setTimeout(function(){ sub.style.opacity = "1"; }, 180);
  setTimeout(function(){ renderWithSlide(renderSetup); }, 1400);
}

// ============================================================
// SETUP SCREEN
// ============================================================
function clampSettings(){
  var n = players.length;
  var maxI = Math.max(1, Math.floor((n-1)/2));
  imposterCount = clampi(imposterCount, 1, maxI);
  var minS = imposterCount + 1;
  var maxS = Math.max(minS, n-1);
  survivorLimit = clampi(survivorLimit, minS, maxS);
}

function renderSetup(){
  setInMatch(false);
  clampSettings();
  clearContent();

  addLabel("CASE No. " + caseNo, 11, "gold");
  var t = addLabel("Who's the Batpar?", 26, null, {bold:true}); t.classList.add("title");
  addLabel("Add players in the order you're sitting, pick categories, set your rules.", 12, "muted");
  addSpacer(6);

  addLabel("PLAYERS (seating order)", 12, "gold", {bold:true});
  players.forEach(function(p, i){
    var row = el("div","name-row");
    var input = el("input"); input.type = "text"; input.value = p.name;
    input.placeholder = "Player " + (i+1);
    input.addEventListener("input", function(){ p.name = input.value; });
    var rm = el("button","small"); rm.textContent = "×";
    rm.addEventListener("click", function(){ playClick(); removePlayer(i); });
    row.appendChild(input); row.appendChild(rm);
    contentEl.appendChild(row);
  });
  addButton("+ Add player", addPlayer);
  addSpacer(14);

  addLabel("CATEGORIES", 12, "gold", {bold:true});
  var flow = el("div","flow");
  Object.keys(allCategories()).forEach(function(catName){
    if (!(catName in selectedCategories)) selectedCategories[catName] = true;
    var cb = makeCheckbox(catName, selectedCategories[catName], function(on){ selectedCategories[catName] = on; });
    flow.appendChild(cb);
  });
  contentEl.appendChild(flow);
  addSpacer(10);

  if (customFormVisible){
    var nameEdit = el("input"); nameEdit.type="text"; nameEdit.placeholder="Category name (e.g. Superheroes)";
    contentEl.appendChild(nameEdit);
    addSpacer(6);
    var wordsEdit = el("textarea"); wordsEdit.placeholder="Words, comma separated (e.g. Batman, Iron Man, Wolverine)";
    contentEl.appendChild(wordsEdit);
    addSpacer(8);
    var row = el("div","row split");
    var cancel = el("button"); cancel.textContent="Cancel";
    cancel.addEventListener("click", function(){ playClick(); customFormVisible=false; renderSetup(); });
    var save = el("button"); save.textContent="Save category";
    save.addEventListener("click", function(){
      playClick();
      var catName = nameEdit.value.trim();
      var words = wordsEdit.value.split(",").map(function(w){return w.trim();}).filter(function(w){return w!=="";});
      if (catName === "" || words.length < 3) return;
      customCategories[catName] = words;
      selectedCategories[catName] = true;
      saveCustomCategories();
      customFormVisible = false;
      renderSetup();
    });
    row.appendChild(cancel); row.appendChild(save);
    contentEl.appendChild(row);
  } else {
    addButton("+ Custom category", function(){ customFormVisible = true; renderSetup(); });
  }
  addSpacer(14);

  addLabel("BATPAR SETTINGS", 12, "gold", {bold:true});
  var impRow = el("div","row");
  var impLbl = el("div"); impLbl.style.flex="1"; impLbl.textContent = "Batpar: " + imposterCount;
  var impMinus = el("button","small"); impMinus.textContent="−";
  impMinus.addEventListener("click", function(){ playClick(); imposterCount -= 1; renderSetup(); });
  var impPlus = el("button","small"); impPlus.textContent="+";
  impPlus.addEventListener("click", function(){ playClick(); imposterCount += 1; renderSetup(); });
  impRow.appendChild(impLbl); impRow.appendChild(impMinus); impRow.appendChild(impPlus);
  contentEl.appendChild(impRow);

  contentEl.appendChild(makeCheckbox("Batpar know each other", knowEachOther, function(on){ knowEachOther = on; }));

  contentEl.appendChild(makeCheckbox("Early Batpar win", survivorLimitEnabled, function(on){ survivorLimitEnabled = on; renderSetup(); }));
  if (survivorLimitEnabled){
    var survRow = el("div","row");
    var survLbl = el("div"); survLbl.style.flex="1"; survLbl.textContent = "Batpar win once " + survivorLimit + " players remain";
    var survMinus = el("button","small"); survMinus.textContent="−";
    survMinus.addEventListener("click", function(){ playClick(); survivorLimit -= 1; renderSetup(); });
    var survPlus = el("button","small"); survPlus.textContent="+";
    survPlus.addEventListener("click", function(){ playClick(); survivorLimit += 1; renderSetup(); });
    survRow.appendChild(survLbl); survRow.appendChild(survMinus); survRow.appendChild(survPlus);
    contentEl.appendChild(survRow);
  }
  addSpacer(14);

  addLabel("SPECIAL ROLES", 12, "gold", {bold:true});
  contentEl.appendChild(makeCheckbox("Include the Sheriff", sheriffEnabled, function(on){ sheriffEnabled = on; }));
  addLabel("One investigation per game. A wrong guess costs the Sheriff their life.", 11, "muted");
  addSpacer(14);

  addLabel("DISCUSSION TIMER", 12, "gold", {bold:true});
  contentEl.appendChild(makeCheckbox("Enable countdown", timerEnabled, function(on){ timerEnabled = on; renderSetup(); }));
  if (timerEnabled){
    var tRow = el("div","row");
    var tLbl = el("div"); tLbl.style.flex="1"; tLbl.textContent = timerMinutes + " minute(s)";
    var tMinus = el("button","small"); tMinus.textContent="−";
    tMinus.addEventListener("click", function(){ playClick(); timerMinutes = Math.max(1, timerMinutes-1); renderSetup(); });
    var tPlus = el("button","small"); tPlus.textContent="+";
    tPlus.addEventListener("click", function(){ playClick(); timerMinutes = Math.min(15, timerMinutes+1); renderSetup(); });
    tRow.appendChild(tLbl); tRow.appendChild(tMinus); tRow.appendChild(tPlus);
    contentEl.appendChild(tRow);
  }
  addSpacer(20);

  var errLbl = addLabel("", 12, null);
  errLbl.style.color = "var(--red)";
  addButton("Deal the case →", function(){ startGame(errLbl); }, true);
  addSpacer(8);
  addButton("🏆 Standings", renderScoreboard);
}

function addPlayer(){
  players.push({id:newId(), name:"", alive:true});
  renderSetup();
}
function removePlayer(idx){
  players.splice(idx,1);
  renderSetup();
}

function startGame(errLbl){
  var names = [];
  players.forEach(function(p){ var nm = p.name.trim(); if (nm !== "") names.push(nm); });
  if (names.length < 3){ errLbl.textContent = "Add at least 3 named players to start."; return; }
  var anySelected = false;
  for (var k in selectedCategories) if (selectedCategories[k]) anySelected = true;
  if (!anySelected){ errLbl.textContent = "Pick at least one category."; return; }

  var kept = [];
  players.forEach(function(p){
    if (p.name.trim() !== ""){ p.alive = true; kept.push(p); }
  });
  players = kept;

  beginRoundSetup();
}

// ============================================================
// ROUND SETUP + REVEAL
// ============================================================
function beginRoundSetup(){
  setInMatch(true);
  var cats = allCategories();
  var selected = [];
  for (var k in selectedCategories) if (selectedCategories[k]) selected.push(k);
  category = selected[Math.floor(Math.random()*selected.length)];
  var wordList = cats[category];
  word = wordList[Math.floor(Math.random()*wordList.length)];
  roundNo = 1;

  var alivePlayers = players.filter(function(p){ return p.alive; });
  var ids = alivePlayers.map(function(p){ return p.id; });
  shuffle(ids);
  imposterIds = ids.slice(0, imposterCount);

  sheriffUsed = false;
  sheriffId = -1;
  sheriffCaughtImposter = false;
  if (sheriffEnabled){
    var nonImp = alivePlayers.filter(function(p){ return imposterIds.indexOf(p.id) === -1; });
    if (nonImp.length > 0) sheriffId = nonImp[Math.floor(Math.random()*nonImp.length)].id;
  }

  revealOrder = alivePlayers.map(function(p){ return p.id; });
  revealIndex = 0;

  renderWithFlip(renderReveal);
}

function renderReveal(){
  clearContent();
  var pid = revealOrder[revealIndex];
  var player = findPlayer(pid);

  addFlexSpacer();
  addLabel("PASS THE PHONE TO", 12, "muted", {center:true});
  addSpacer(8);
  addNamePill(player.name);
  addSpacer(20);

  var isImp = imposterIds.indexOf(pid) !== -1;
  var isSheriff = !isImp && pid === sheriffId;

  var cardWrap = el("div","card-wrap");
  var card = el("div","card flip-x");
  cardWrap.appendChild(card);
  contentEl.appendChild(cardWrap);

  var tapBtn = el("button","tap-btn");
  tapBtn.textContent = "TAP TO VIEW\nYOUR ROLE";
  card.appendChild(tapBtn);

  addSpacer(18);
  var nextBtn = addButton("Got it, pass the phone →", onRevealNext, true);
  nextBtn.style.display = "none";
  addFlexSpacer();

  var revealed = false;
  tapBtn.addEventListener("click", function(){
    if (revealed) return;
    revealed = true;
    playFlip();
    card.style.transition = "transform .15s ease-in";
    card.style.transform = "scaleX(0.02)";
    setTimeout(function(){
      card.innerHTML = "";
      var borderClass = "innocent";
      if (isImp) borderClass = "imp";
      else if (isSheriff) borderClass = "sheriff";
      card.className = "card flip-x " + borderClass;

      var stamp = el("div","stamp " + (isImp?"imp":(isSheriff?"sheriff":"innocent")));
      var wordEl = el("div","word");
      var subEl = el("div","sub");

      if (isImp){
        stamp.textContent = "BATPAR";
        wordEl.textContent = category.toUpperCase();
        var sub = "You don't know the word. Blend in — talk like you know it.";
        if (knowEachOther && imposterIds.length > 1){
          var others = imposterIds.filter(function(oid){return oid!==pid;}).map(function(oid){return findPlayer(oid).name;});
          sub += " Your fellow Batpar: " + others.join(", ") + ".";
        }
        subEl.textContent = sub;
      } else if (isSheriff){
        stamp.textContent = "SHERIFF";
        wordEl.textContent = word;
        subEl.textContent = "Category: " + category + ". You get ONE investigation this game — use the 🔍 button during discussion. Guess wrong and you're out.";
      } else {
        stamp.textContent = "INNOCENT";
        wordEl.textContent = word;
        subEl.textContent = "Category: " + category + ". Describe it carefully — don't make it obvious.";
      }

      card.appendChild(stamp); card.appendChild(wordEl); card.appendChild(subEl);
      card.style.transition = "none";
      card.style.transform = "scaleX(0.02)";
      void card.offsetWidth;
      card.style.transition = "transform .17s ease-out";
      card.style.transform = "scaleX(1)";
      nextBtn.style.display = "";
    }, 150);
  });
}

function onRevealNext(){
  revealIndex += 1;
  if (revealIndex >= revealOrder.length) goToDiscuss();
  else renderWithFlip(renderReveal);
}

// ============================================================
// DISCUSS
// ============================================================
function goToDiscuss(){
  countdownInterval && clearInterval(countdownInterval);
  renderWithFlip(renderDiscuss);
}

function renderDiscuss(){
  clearContent();
  timerLabelEl = null;
  addLabel("ROUND " + roundNo + " · DISCUSSION", 12, "gold", {bold:true});
  addLabel(category.toUpperCase(), 15);
  addSpacer(4);
  addLabel("Everyone describes the word out loud, one at a time. Stay vague enough not to give it away.", 12, "muted");
  addSpacer(10);

  if (timerEnabled){
    timerRemaining = timerMinutes * 60;
    timerLabelEl = addLabel(formatTime(timerRemaining), 34, null, {center:true, bold:true});
    timerLabelEl.classList.add("timer-big");
    countdownInterval && clearInterval(countdownInterval);
    countdownInterval = setInterval(onTimerTick, 1000);
  }

  addSpacer(14);
  addButton("Move to vote →", beginVoting, true);

  if (sheriffEnabled && sheriffId !== -1 && isAlive(sheriffId) && !sheriffUsed){
    addButton("🔍 Sheriff's move (once per game)", renderSheriffPrivacy);
  }
}

function onTimerTick(){
  timerRemaining -= 1;
  if (timerLabelEl) timerLabelEl.textContent = formatTime(Math.max(timerRemaining,0));
  if (timerRemaining <= 0) clearInterval(countdownInterval);
}

// ============================================================
// SHERIFF ACTION
// ============================================================
function renderSheriffPrivacy(){
  clearContent();
  addLabel("🔍 SHERIFF'S MOVE", 12, "blue", {bold:true});
  var t = addLabel("Only the Sheriff should continue", 20, null, {bold:true}); t.style.fontWeight="800";
  addLabel("Everyone else, look away. This is the Sheriff's only investigation of the game.", 12, "muted");
  addSpacer(16);
  var row = el("div","row split");
  var cancel = el("button"); cancel.textContent = "Never mind";
  cancel.addEventListener("click", function(){ playClick(); renderWithFlip(renderDiscuss); });
  var proceed = el("button","primary"); proceed.textContent = "I'm the Sheriff →";
  proceed.addEventListener("click", function(){ playClick(); renderWithFlip(renderSheriffPick); });
  row.appendChild(cancel); row.appendChild(proceed);
  contentEl.appendChild(row);
}

function renderSheriffPick(){
  clearContent();
  addLabel("🔍 CHOOSE A SUSPECT", 12, "blue", {bold:true});
  addLabel("Guess right and they're eliminated. Guess wrong, and you are.", 12, "muted");
  addSpacer(10);
  players.forEach(function(p){
    if (!p.alive || p.id === sheriffId) return;
    addButton(p.name, function(){ renderWithFlip(function(){ resolveSheriffAction(p.id); }); });
  });
}

function resolveSheriffAction(targetId){
  sheriffUsed = true;
  var target = findPlayer(targetId);
  var sheriff = findPlayer(sheriffId);
  var targetIsImp = imposterIds.indexOf(targetId) !== -1;

  clearContent();
  if (targetIsImp){
    target.alive = false;
    sheriffCaughtImposter = true;
    addLabel("CASE CRACKED", 12, "gold", {bold:true});
    var t=addLabel(target.name, 26, null, {bold:true}); t.style.fontWeight="800";
    addLabel("BATPAR CAUGHT", 13, "green");
    addLabel("Good instincts — " + target.name + " has been eliminated.", 12, "muted");
  } else {
    sheriff.alive = false;
    addLabel("BAD CALL", 12, "red", {bold:true});
    var t2=addLabel(sheriff.name, 26, null, {bold:true}); t2.style.fontWeight="800";
    addLabel("SHERIFF ELIMINATED", 13, "red");
    addLabel(target.name + " was innocent. The Sheriff paid the price.", 12, "muted");
  }
  addSpacer(16);
  addButton("Continue →", function(){ renderWithFlip(afterElimination); }, true);
}

// ============================================================
// VOTE
// ============================================================
function beginVoting(){
  countdownInterval && clearInterval(countdownInterval);
  var alivePlayers = players.filter(function(p){ return p.alive; });
  votingOrder = alivePlayers.map(function(p){ return p.id; });
  voteIndex = 0;
  votes = {};
  renderWithFlip(showVotePassScreen);
}

function showVotePassScreen(){
  clearContent();
  var voterId = votingOrder[voteIndex];
  var voter = findPlayer(voterId);
  addFlexSpacer();
  addLabel("PASS THE PHONE TO", 12, "muted", {center:true});
  addSpacer(8);
  addNamePill(voter.name);
  addSpacer(14);
  addLabel("Tap ready once you have the phone.", 12, "muted", {center:true});
  addSpacer(24);
  addButton("I'm ready →", function(){ renderWithFlip(renderVote); }, true);
  addFlexSpacer();
}

function renderVote(){
  clearContent();
  var voterId = votingOrder[voteIndex];
  var voter = findPlayer(voterId);

  addLabel("VOTING", 12, "muted");
  addNamePill(voter.name);
  addSpacer(6);
  addLabel("Who's the Batpar?", 15, "muted", {center:true});
  addSpacer(12);

  pendingVoteId = -1;
  var buttons = [];
  players.forEach(function(p){
    if (!p.alive) return;
    var labelText = p.name + (p.id === voterId ? " (you)" : "");
    var btn = addButton(labelText, null);
    btn.classList.add("vote-btn");
    if (p.id === voterId) btn.disabled = true;
    buttons.push({btn:btn, id:p.id});
    if (p.id !== voterId){
      btn.addEventListener("click", function(){
        pendingVoteId = p.id;
        buttons.forEach(function(b){ b.btn.classList.remove("picked"); });
        btn.classList.add("picked");
      });
    }
  });

  addSpacer(14);
  addButton("Lock in vote →", onLockInVote, true);
}

function onLockInVote(){
  if (pendingVoteId === -1) return;
  votes[pendingVoteId] = (votes[pendingVoteId] || 0) + 1;
  voteIndex += 1;
  if (voteIndex >= votingOrder.length) renderWithFlip(tallyVotes);
  else renderWithFlip(showVotePassScreen);
}

function renderVoteBreakdown(){
  var rows = votingOrder.map(function(id){
    return {id:id, name:findPlayer(id).name, count:votes[id]||0};
  }).sort(function(a,b){ return b.count - a.count; });
  var maxCount = Math.max.apply(null, rows.map(function(r){return r.count;}).concat([1]));

  addLabel("VOTES RECEIVED", 12, "gold", {bold:true});
  addSpacer(4);
  var wrap = el("div","vote-breakdown");
  rows.forEach(function(r){
    var row = el("div","vote-row");
    var nameEl2 = el("div","vote-name", r.name);
    var track = el("div","vote-bar-track");
    var fill = el("div","vote-bar-fill");
    fill.style.width = ((r.count/maxCount)*100) + "%";
    track.appendChild(fill);
    var count = el("div","vote-count", r.count + (r.count===1?" vote":" votes"));
    row.appendChild(nameEl2);
    row.appendChild(track);
    row.appendChild(count);
    wrap.appendChild(row);
  });
  contentEl.appendChild(wrap);
}

function tallyVotes(){
  var maxVotes = 0;
  for (var id in votes) if (votes[id] > maxVotes) maxVotes = votes[id];
  var topIds = [];
  for (var id2 in votes) if (votes[id2] === maxVotes) topIds.push(Number(id2));

  if (topIds.length !== 1){ showHungJury(); return; }

  var eliminatedId = topIds[0];
  var player = findPlayer(eliminatedId);
  player.alive = false;
  var wasImp = imposterIds.indexOf(eliminatedId) !== -1;

  clearContent();
  addLabel("THE TABLE HAS SPOKEN", 12, "gold", {bold:true, center:true});
  addSpacer(4);
  var block = el("div","result-block");
  var nameEl = el("div","result-name", player.name);
  var badge = el("div","badge " + (wasImp?"red":"green"), wasImp ? "BATPAR" : "INNOCENT");
  block.appendChild(nameEl);
  block.appendChild(badge);
  contentEl.appendChild(block);
  addSpacer(6);
  addLabel(wasImp ? "One down. Keep going if there are more." : "An innocent voted out — the Batpar are still among you.", 12, "muted", {center:true});
  addSpacer(16);
  renderVoteBreakdown();
  addSpacer(14);
  addButton("Continue →", function(){ renderWithFlip(afterElimination); }, true);
}

function showHungJury(){
  clearContent();
  addLabel("THE TABLE HAS SPOKEN", 12, "gold", {bold:true, center:true});
  addSpacer(4);
  var block = el("div","result-block");
  var nameEl = el("div","result-name", "No majority");
  var badge = el("div","badge gold", "VOTE TIED");
  block.appendChild(nameEl);
  block.appendChild(badge);
  contentEl.appendChild(block);
  addSpacer(6);
  addLabel("The table couldn't agree — no one is eliminated this round.", 12, "muted", {center:true});
  addSpacer(16);
  renderVoteBreakdown();
  addSpacer(14);
  addButton("Continue →", function(){ roundNo += 1; renderWithFlip(renderDiscuss); }, true);
}

function renderRoster(){
  players.forEach(function(p){
    var lbl = el("div","roster-row" + (!p.alive?" out":""));
    lbl.textContent = p.name + (!p.alive ? "  — out" : "");
    contentEl.appendChild(lbl);
  });
}

// ============================================================
// WIN CHECK + GAME OVER
// ============================================================
function afterElimination(){
  var result = checkWinCondition();
  if (result === "villagers") endGame(true, "caught");
  else if (result === "impostors_parity") endGame(false, "parity");
  else if (result === "impostors_limit") endGame(false, "limit");
  else { roundNo += 1; renderDiscuss(); }
}

function checkWinCondition(){
  var alivePlayers = players.filter(function(p){ return p.alive; });
  var aliveImp = alivePlayers.filter(function(p){ return imposterIds.indexOf(p.id) !== -1; }).length;
  var aliveVil = alivePlayers.length - aliveImp;
  if (aliveImp === 0) return "villagers";
  if (aliveImp >= aliveVil) return "impostors_parity";
  if (survivorLimitEnabled && alivePlayers.length <= survivorLimit) return "impostors_limit";
  return "";
}

function endGame(villagersWon, reason){
  countdownInterval && clearInterval(countdownInterval);
  setInMatch(false);
  clearContent();

  addLabel(villagersWon ? "CASE CLOSED" : "CASE LOST", 12, "gold", {bold:true});
  var t=addLabel(villagersWon ? "Innocents win" : "Batpar wins", 26, null, {bold:true}); t.style.fontWeight="800";

  var sub = "";
  if (villagersWon) sub = "Every Batpar was caught before they could take over.";
  else if (reason === "limit") sub = "The Batpar survived long enough to run out the clock — case goes cold.";
  else sub = "The Batpar blended in long enough to take control of the table.";
  addLabel(sub, 12, "muted");
  addSpacer(10);

  var t2=addLabel("The word was: " + word + " (" + category + ")", 15, null, {bold:true}); t2.style.fontWeight="800";
  addSpacer(6);
  addLabel("Batpar:", 12, "gold", {bold:true});
  imposterIds.forEach(function(id){
    var p = findPlayer(id);
    var lbl = el("div"); lbl.textContent = "• " + p.name;
    contentEl.appendChild(lbl);
  });

  var points = {};
  players.forEach(function(p){ points[p.id] = 0; });
  if (villagersWon){
    players.forEach(function(p){ if (imposterIds.indexOf(p.id) === -1) points[p.id] += 1; });
  } else {
    imposterIds.forEach(function(id){ points[id] += 1; });
  }
  if (sheriffId !== -1 && sheriffCaughtImposter) points[sheriffId] = (points[sheriffId]||0) + 1;
  for (var id in points) scores[id] = (scores[id]||0) + points[id];
  gamesPlayed += 1;

  addSpacer(16);
  addLabel("🏆 Standings after this round", 13, "gold", {bold:true});
  var rows = players.map(function(p){
    return {name:p.name, score:scores[p.id]||0, delta:points[p.id]||0};
  }).sort(function(a,b){ return b.score - a.score; });
  rows.forEach(function(r){
    var deltaTxt = r.delta > 0 ? (" (+" + r.delta + ")") : "";
    var lbl = el("div"); lbl.textContent = r.name + " — " + r.score + " pts" + deltaTxt;
    contentEl.appendChild(lbl);
  });

  addSpacer(18);
  var row = el("div","row split");
  var newSetup = el("button"); newSetup.textContent = "New setup";
  newSetup.addEventListener("click", function(){ playClick(); renderWithFlip(renderSetup); });
  var replay = el("button","primary"); replay.textContent = "Play again →";
  replay.addEventListener("click", function(){
    playClick();
    players.forEach(function(p){ p.alive = true; });
    beginRoundSetup();
  });
  row.appendChild(newSetup); row.appendChild(replay);
  contentEl.appendChild(row);
}

// ============================================================
// SCOREBOARD
// ============================================================
function renderScoreboard(){
  setInMatch(false);
  clearContent();
  addLabel("🏆 STANDINGS", 12, "gold", {bold:true});
  addSpacer(6);
  if (gamesPlayed === 0 || players.length === 0){
    addLabel("No games finished yet — standings show up after your first round ends.", 12, "muted");
  } else {
    var rows = players.map(function(p){ return {name:p.name, score:scores[p.id]||0}; })
      .sort(function(a,b){ return b.score - a.score; });
    rows.forEach(function(r,i){
      var lbl = el("div"); lbl.textContent = (i+1) + ". " + r.name + " — " + r.score + " pts";
      contentEl.appendChild(lbl);
    });
  }
  addSpacer(18);
  var row = el("div","row split");
  var reset = el("button"); reset.textContent = "Reset scores";
  reset.addEventListener("click", function(){ playClick(); scores = {}; gamesPlayed = 0; renderScoreboard(); });
  var back = el("button"); back.textContent = "Back";
  back.addEventListener("click", function(){ playClick(); renderSetup(); });
  row.appendChild(reset); row.appendChild(back);
  contentEl.appendChild(row);
}

// ============================================================
// INIT
// ============================================================
function init(){
  caseNo = Math.floor(Math.random()*9000) + 1000;
  loadCustomCategories();
  for (var i=0;i<3;i++) players.push({id:newId(), name:"", alive:true});
  Object.keys(BUILT_IN_CATEGORIES).forEach(function(cat){ selectedCategories[cat] = true; });
  showSplash();
}
init();

})();
</script>
</body>
</html>
